# dsh-superagent bundle layer: inserts the plugins without configuration, and the agent presets its Sessions run under. The
# profile supplies the `dsh-superagent` entry's stateDir (see docs/006-deployment.md and examples/profile.cordis.patch.yml); the plugin
# refuses to start without stateDir.
- insert:
    - id: dsh-superagent
      name: dsh-superagent
    - id: dsh-superagent-github
      name: dsh-superagent/github-watch
    # Optional Feishu Source; requires configuring a bot CLI after enabling.
    - id: dsh-superagent-feishu
      name: dsh-superagent/feishu-watch
      disabled: true
    # The agent preset of every Executor Session (WORKER_PRESET in src/app/sessions.ts); the main Session has its own, below.
    # The worker gets only ticket-scoped orchestrator tools until an isolated process executor is verified.
    # A preset row has no setting that hides it from the preset picker, so its name and description say whom it is for.
    - id: dsh-superagent-worker-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dsh-superagent-worker
        name: dsh-superagent 执行器
        description: dsh-superagent 执行器专用；只使用当前工单的编排工具，主机执行工具已关闭。
        order: 90
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
    # The agent preset of the main Session (ROUTER_PRESET in src/app/sessions.ts), with no host execution or filesystem tools.
    # It uses no subagents, web, file search or writes, todo list, questions to a person, presenting,
    # plan mode, plugin manager, scheduling, goals or workflows. No persona: the main Session's prompt is complete, so it has
    # no other section.
    - id: dsh-superagent-router-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dsh-superagent-router
        name: dsh-superagent 主 Session
        description: dsh-superagent 的主 Session 专用，不供手动选择。前台命令和任务等待超 5 秒转入后台，只含路由所需的工具。
        order: 91
        plugins:
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
